<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light">
  </head>
  <body style="margin:0;padding:0;background:#eef1f6;font-family:Poppins,Arial,Helvetica,sans-serif;color:#1B2B5E">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0">{{title}} · Atlas Hub</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef1f6">
      <tr>
        <td align="center" style="padding:36px 14px">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(15,26,58,.10)">
            <tr><td style="height:6px;background:#1B2B5E"></td></tr>
            <tr>
              <td align="center" style="padding:36px 40px 0">
                <img src="{{logoUrl}}" alt="Atlas Hub" height="32" style="display:block;height:32px;border:0">
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:18px 40px 0">
                <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="height:3px;width:56px;background:#C49020;border-radius:3px;font-size:0;line-height:0">&nbsp;</td></tr></table>
              </td>
            </tr>
            <tr>
              <td style="padding:26px 40px 40px">
                <h1 style="margin:0 0 16px;font-size:21px;line-height:1.32;font-weight:700;color:#1B2B5E">{{title}}</h1>
                <div style="font-size:15px;line-height:1.7;color:#4b5563">{{content}}</div>
                {{ctaBlock}}
              </td>
            </tr>
            <tr>
              <td align="center" style="background:#0f1a3a;padding:30px 40px">
                <p style="margin:0;font-size:13px;font-weight:600;color:#C49020">Construa sem banco. Capte com investidores.</p>
                <p style="margin:10px 0 0;font-size:11px;line-height:1.5;color:rgba(255,255,255,.55)">© {{year}} Atlas Hub · Conectando Capital ao Mercado Imobiliário</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
