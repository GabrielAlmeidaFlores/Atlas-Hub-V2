<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{{title}}</title>
  </head>
  <body style="margin:0;padding:0;background:#F4F6FA;font-family:Roboto,'Helvetica Neue',Arial,Helvetica,sans-serif;color:#0f172a">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0">{{preheader}}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F4F6FA">
      <tr>
        <td align="center" style="padding:34px 14px">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 12px 34px rgba(15,26,58,.14)">
            <tr><td style="height:4px;background:#C49020;font-size:0;line-height:0">&nbsp;</td></tr>
            <tr>
              <td style="padding:22px 34px;border-bottom:1px solid #e2e8f0">
                <img src="{{logoUrl}}" alt="Atlas Hub" height="26" style="display:block;height:26px;border:0">
              </td>
            </tr>
            <tr>
              <td style="background-color:#1B2B5E;background-image:linear-gradient(160deg,#0a1224 0%,#1B2B5E 52%,#0d1830 100%);padding:38px 34px">
                <p style="margin:0 0 12px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#C49020">Atlas Hub</p>
                <h1 style="margin:0;font-size:25px;line-height:1.25;font-weight:900;letter-spacing:.01em;text-transform:uppercase;color:#ffffff">{{title}}</h1>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:18px"><tr><td style="height:3px;width:52px;background:#C49020;border-radius:3px;font-size:0;line-height:0">&nbsp;</td></tr></table>
              </td>
            </tr>
            <tr>
              <td style="padding:34px 34px 6px">
                <div style="font-size:15px;line-height:1.72;color:#475569">{{content}}</div>
                {{ctaBlock}}
              </td>
            </tr>
            <tr><td style="height:34px;font-size:0;line-height:0">&nbsp;</td></tr>
            <tr>
              <td align="center" style="background:#0f1a3a;padding:28px 34px">
                <p style="margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#C49020">Construa sem banco. Capte com investidores.</p>
                <p style="margin:12px 0 0;font-size:11px;line-height:1.6;color:rgba(255,255,255,.5)">© {{year}} Atlas Hub · Conectando Capital ao Mercado Imobiliário</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:11px;color:#94a3b8">Este é um e-mail automático da Atlas Hub.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
