service: atlas-hub-analytics

frameworkVersion: '>=3'

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  coreStack: atlas-hub-backend-${self:provider.stage}
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: cjs
    external:
      - '@aws-sdk/*'
    packager: npm
    loader:
      '.html': text
  serverless-offline:
    httpPort: 3100
    lambdaPort: 3102

provider:
  name: aws
  runtime: nodejs20.x
  region: sa-east-1
  stage: ${opt:stage, 'dev'}
  versionFunctions: false
  apiGateway:
    restApiId: ${cf:${self:custom.coreStack}.ApiGatewayRestApiId}
    restApiRootResourceId: ${cf:${self:custom.coreStack}.ApiGatewayRestApiRootResourceId}
  environment:
    STAGE: ${self:provider.stage}
    ANALYTICS_EVENTS_TABLE: AtlasAnalyticsEvents-${self:provider.stage}
    ANALYTICS_SESSIONS_TABLE: AtlasAnalyticsSessions-${self:provider.stage}
    ANALYTICS_DAILY_TABLE: AtlasAnalyticsDaily-${self:provider.stage}
    ANALYTICS_HEATMAPS_TABLE: AtlasAnalyticsHeatmaps-${self:provider.stage}
    ANALYTICS_ALERTS_TABLE: AtlasAnalyticsAlerts-${self:provider.stage}
    ANALYTICS_REPLAYS_TABLE: AtlasAnalyticsReplays-${self:provider.stage}
    ADMINS_TABLE: AtlasAdmins-${self:provider.stage}
    INCORPORADORAS_TABLE: AtlasIncorporadoras-${self:provider.stage}
    RESEND_API_KEY: ${env:RESEND_API_KEY, ''}
    EMAIL_FROM: ${env:EMAIL_FROM, 'noreply@atlascomp.com.br'}
    APP_URL: ${env:APP_URL, 'https://master.d3vqf6k21x668r.amplifyapp.com'}
    CORS_ORIGINS: ${env:CORS_ORIGINS, '*'}
  logRetentionInDays: 14

functions:
  analyticsCollect:
    handler: src/functions/analytics-collect.handler
    role: !GetAtt AnalyticsCollectLambdaRole.Arn
    timeout: 15
    description: "Ingests analytics event batches from LP and app"
    events:
      - http: { path: analytics/collect, method: post, cors: true }

  analyticsDashboard:
    handler: src/functions/analytics-dashboard.handler
    role: !GetAtt AnalyticsAdminLambdaRole.Arn
    timeout: 20
    description: "Admin analytics dashboard aggregates"
    events:
      - http:
          path: analytics/admin/dashboard
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:${self:custom.coreStack}.ApiGatewayAuthorizerId}

  analyticsFunnel:
    handler: src/functions/analytics-funnel.handler
    role: !GetAtt AnalyticsAdminLambdaRole.Arn
    timeout: 20
    description: "Admin conversion funnel"
    events:
      - http:
          path: analytics/admin/funnel
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:${self:custom.coreStack}.ApiGatewayAuthorizerId}

  analyticsUser:
    handler: src/functions/analytics-user.handler
    role: !GetAtt AnalyticsAdminLambdaRole.Arn
    timeout: 15
    description: "Admin user analytics profile and timeline"
    events:
      - http:
          path: analytics/admin/users/{userId}
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:${self:custom.coreStack}.ApiGatewayAuthorizerId}

  analyticsHeatmap:
    handler: src/functions/analytics-heatmap.handler
    role: !GetAtt AnalyticsAdminLambdaRole.Arn
    timeout: 10
    description: "Admin LP heatmap cells"
    events:
      - http:
          path: analytics/admin/heatmap
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:${self:custom.coreStack}.ApiGatewayAuthorizerId}

  analyticsAlerts:
    handler: src/functions/analytics-alerts.handler
    role: !GetAtt AnalyticsAdminLambdaRole.Arn
    timeout: 10
    description: "Admin analytics alerts CRUD"
    events:
      - http:
          path: analytics/admin/alerts
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:${self:custom.coreStack}.ApiGatewayAuthorizerId}
      - http:
          path: analytics/admin/alerts
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:${self:custom.coreStack}.ApiGatewayAuthorizerId}

  analyticsExport:
    handler: src/functions/analytics-export.handler
    role: !GetAtt AnalyticsAdminLambdaRole.Arn
    timeout: 20
    description: "Exports analytics CSV"
    events:
      - http:
          path: analytics/admin/export
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:${self:custom.coreStack}.ApiGatewayAuthorizerId}

  analyticsReplay:
    handler: src/functions/analytics-replay.handler
    role: !GetAtt AnalyticsAdminLambdaRole.Arn
    timeout: 15
    description: "Session replay ingest, list and playback payload"
    events:
      - http: { path: analytics/replay, method: post, cors: true }
      - http:
          path: analytics/admin/replay
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:${self:custom.coreStack}.ApiGatewayAuthorizerId}
      - http:
          path: analytics/admin/replay/{id}
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${cf:${self:custom.coreStack}.ApiGatewayAuthorizerId}

  analyticsAlertsEvaluate:
    handler: src/functions/analytics-alerts-evaluate.handler
    role: !GetAtt AnalyticsAdminLambdaRole.Arn
    timeout: 30
    description: "Evaluates analytics alert rules and emails admins"
    events:
      - schedule: rate(1 hour)

resources:
  Resources:
    AnalyticsCollectLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: atlas-analyticsCollect-${self:provider.stage}
        AssumeRolePolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        Policies:
          - PolicyName: Policy
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                  Resource: arn:aws:logs:*:*:*
                - Effect: Allow
                  Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:GetItem, dynamodb:BatchWriteItem, dynamodb:Query, dynamodb:Scan]
                  Resource:
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsEvents-${self:provider.stage}'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsEvents-${self:provider.stage}/index/*'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsSessions-${self:provider.stage}'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsSessions-${self:provider.stage}/index/*'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsDaily-${self:provider.stage}'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsHeatmaps-${self:provider.stage}'

    AnalyticsAdminLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: atlas-analyticsAdmin-${self:provider.stage}
        AssumeRolePolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        Policies:
          - PolicyName: Policy
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                  Resource: arn:aws:logs:*:*:*
                - Effect: Allow
                  Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan]
                  Resource:
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsEvents-${self:provider.stage}'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsEvents-${self:provider.stage}/index/*'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsSessions-${self:provider.stage}'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsSessions-${self:provider.stage}/index/*'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsDaily-${self:provider.stage}'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsHeatmaps-${self:provider.stage}'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsAlerts-${self:provider.stage}'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAnalyticsReplays-${self:provider.stage}'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasIncorporadoras-${self:provider.stage}'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AtlasAdmins-${self:provider.stage}'
